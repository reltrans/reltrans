name: Test

on:
  workflow_dispatch: # allows manual triggering
  pull_request:
    branches:
      - main
    paths: [
      '.github/workflows/test.yml',
      '**/*.f90',
      '**/*.py',
      'Makefile',
      'utils/cli.c',
      'wrappers.f90'
    ]
  push:
    branches:
      - main
      - ci # for testing ci
    paths: [
      '.github/workflows/test.yml',
      '**/*.f90',
      '**/*.py',
      'Makefile',
      'utils/cli.c',
      'wrappers.f90'
    ]

concurrency:
  # cancels when a PR gets updated
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Setup Fortran compilers on MacOS
        # Only MacOS needs the explicitly setup in the Fortran compilers.
        if: ${{ contains(matrix.os, 'macos') }}
        uses: fortran-lang/setup-fortran@v1
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade numpy pytest xspectrampoline
      - name: Compile pyreltrans and install
        run: |
          python3 ./dist-package.py
          python3 -m pip install .
      - name: Install GitHub CLI and fetch data files
        run: |
          apt update && apt install -y gh

          # Authenticate with GitHub cli
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

          # This release version will have to be changed if changes to the test
          # data are made
          gh release download v0.1.0 -D reltrans-data -R reltrans/model-data

          # Stitch the large files back together
          cd reltrans-data
          cat $(ls xillverCp_v3.4_normalised.fits-* | sort -V) > xillverCp_v3.4_normalised.fits
      - name: Smoketest pyreltrans
        run: |
          export RELTRANS_TABLES="$(realpath reltrans-data)"
          # Change directory to avoid any namespace / Python module clashes
          ( cd test ; pytest -vvv . )
