name: Unit Tests

# Trigger the test on push or pull request
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - uses: actions/checkout@v3

    # 2. Set up Python (we test on 3.10, a standard version)
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock numpy scipy
        # Add any other libraries reltrans needs (e.g., astropy if required)

    # 4. Run the mock tests
    - name: Run Unit Tests
      run: |
        pytest test/test_wrapper_mock.py
